<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Basket | Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
    <script type="module" src="cart.js"></script>
</head>
<body>
    <main class="cart-page">
        <header><p>LESSON 13 CLASS BUILD</p><h1>Market Basket</h1><p>Everyday essentials, made simple.</p></header>
        <section><h2>Products</h2><div id="products" class="products"></div></section>
        <section class="basket">
            <div class="basket-heading"><h2>Your basket</h2><span id="cart-count">0 items</span></div>
            <div id="cart-items"></div>
            <p class="total">Total: <strong id="cart-total">KSh 0</strong></p>
            <button id="clear-cart" type="button">Clear cart</button>
        </section>
    </main>
</body>
</html>
